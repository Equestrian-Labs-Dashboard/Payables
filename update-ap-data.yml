name: Update AP Dashboard Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * *" # 09:15 La Paz (UTC-4)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: payables-pages
  cancel-in-progress: false

env:
  GSHEET_ID: "1wU-is7u0YFXbI3ZRYZ2MlEO-mqY8bD4NAXouNxhg73c"
  GSHEET_BILLS_SHEET: "QuickBooks Bills Import"
  GSHEET_GENERAL_LEDGER_SHEET: "QuickBooks General Ledger Import"
  GSHEET_GENERAL_LEDGER_GID: "186431676"
  GSHEET_VENDOR_BALANCE_SHEET: "QuickBooks Vendor Balance Detail Import"
  GSHEET_VENDOR_BALANCE_GID: "1046490113"

jobs:
  update-data:
    name: Update AP from QuickBooks Bills / Coefficient
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Build AP dashboard data
        run: python scripts/transform.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/ap-data.json')
          if not p.exists(): raise SystemExit('data/ap-data.json was not generated')
          d=json.loads(p.read_text(encoding='utf-8'))
          total=float(d.get('kpis',{}).get('total_ap',0) or 0)
          bills=int(d.get('quality',{}).get('open_bills',0) or 0)
          print(f"Total AP: ${total:,.2f}")
          print(f"Open bills: {bills}")
          if bills == 0:
              raise SystemExit('No open bills were parsed. Check the Coefficient QuickBooks Bills Import.')
          if total <= 0:
              raise SystemExit('Total AP is zero even though open bills exist. Check Bill.Balance in the Coefficient import.')
          r=d.get('reconciliation',{})
          if r.get('vendor_balance_available') and abs(float(r.get('variance',0) or 0)) > 0.02:
              print('::warning title=Vendor Balance variance::Bills object and Vendor Balance Detail do not reconcile exactly. Review unapplied credits/report API behavior.')
          PY

      - name: Commit updated dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ap-data.json
          if git diff --staged --quiet; then
            echo "No AP data changes to commit."
          else
            git commit -m "chore: update AP from QuickBooks Bills via Coefficient"
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Upload dashboard artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-pages:
    name: Deploy GitHub Pages
    needs: update-data
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
