name: Update AP Dashboard Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * *" # 09:15 La Paz (UTC-4)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: payables-pages
  cancel-in-progress: false

env:
  # Public/non-sensitive source identifiers. No QuickBooks API secret is needed.
  GSHEET_ID: ${{ vars.GSHEET_ID || '1wU-is7u0YFXbI3ZRYZ2MlEO-mqY8bD4NAXouNxhg73c' }}
  GSHEET_BILLS_SHEET: ${{ vars.GSHEET_BILLS_SHEET || 'QuickBooks Bill' }}
  GSHEET_BILLS_GID: ${{ vars.GSHEET_BILLS_GID || '1297077839' }}
  GSHEET_GENERAL_LEDGER_SHEET: ${{ vars.GSHEET_GENERAL_LEDGER_SHEET || 'QuickBooks General Ledger Import' }}
  GSHEET_GENERAL_LEDGER_GID: ${{ vars.GSHEET_GENERAL_LEDGER_GID || '186431676' }}

jobs:
  update-data:
    name: Update AP from Coefficient / QuickBooks Bills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Show configured sources
        run: |
          echo "Spreadsheet: $GSHEET_ID"
          echo "Bills: $GSHEET_BILLS_SHEET (gid=$GSHEET_BILLS_GID)"
          echo "General Ledger: $GSHEET_GENERAL_LEDGER_SHEET (gid=$GSHEET_GENERAL_LEDGER_GID)"

      - name: Build AP dashboard data
        run: python scripts/transform.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/ap-data.json')
          if not p.exists():
              raise SystemExit('data/ap-data.json was not generated')
          d = json.loads(p.read_text(encoding='utf-8'))
          total = float(d.get('kpis', {}).get('total_ap', 0) or 0)
          bills = int(d.get('quality', {}).get('open_bills', 0) or 0)
          accounts = len(d.get('accounts_summary', []) or [])
          vendors = len(d.get('top_vendors', []) or [])
          print(f"Total AP: ${total:,.2f}")
          print(f"Open bills: {bills}")
          print(f"Accounts with AP: {accounts}")
          print(f"Top vendor rows: {vendors}")
          if bills <= 0:
              raise SystemExit('No open Bills were parsed from Coefficient QuickBooks Bill import.')
          if total <= 0:
              raise SystemExit('Open Bills exist but Total AP is zero. Verify Balance is selected in the QuickBooks Bill import.')
          if not d.get('invoices'):
              raise SystemExit('Invoice detail is empty.')
          r = d.get('reconciliation', {})
          variance = abs(float(r.get('variance', 0) or 0))
          if variance > 0.05:
              raise SystemExit(f'Account allocation variance is ${variance:,.2f}; line allocations must reconcile to Total AP.')
          if accounts <= 0:
              raise SystemExit('No QuickBooks line accounts were allocated to open AP.')
          PY

      - name: Commit updated dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ap-data.json
          if git diff --staged --quiet; then
            echo "No AP data changes to commit."
          else
            git commit -m "chore: refresh AP from QuickBooks Bills via Coefficient"
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Upload dashboard artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-pages:
    name: Deploy GitHub Pages
    needs: update-data
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
