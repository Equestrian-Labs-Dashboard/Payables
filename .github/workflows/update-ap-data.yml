name: Update AP Dashboard Data

on:
  # Reads the latest Coefficient-refreshed QuickBooks data from Google Sheets.
  schedule:
    - cron: "0 13 * * *" # 09:00 La Paz (UTC-4)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-data:
    name: Update AP from Coefficient / Google Sheets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r scripts/requirements.txt

      - name: Validate Google Sheets configuration
        env:
          GSHEET_ID: ${{ vars.GSHEET_ID }}
        shell: bash
        run: |
          if [ -z "$GSHEET_ID" ]; then
            echo "::error title=Missing GitHub variable::Create GSHEET_ID in Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Build AP dashboard data
        env:
          GSHEET_ID: ${{ vars.GSHEET_ID }}
          GSHEET_VENDOR_BALANCE_SHEET: ${{ vars.GSHEET_VENDOR_BALANCE_SHEET }}
          GSHEET_VENDOR_BALANCE_GID: ${{ vars.GSHEET_VENDOR_BALANCE_GID }}
          GSHEET_GENERAL_LEDGER_SHEET: ${{ vars.GSHEET_GENERAL_LEDGER_SHEET }}
          GSHEET_GENERAL_LEDGER_GID: ${{ vars.GSHEET_GENERAL_LEDGER_GID }}
        run: python scripts/transform.py

      - name: Commit updated dashboard data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ap-data.json
          if git diff --staged --quiet; then
            echo "No AP data changes to commit."
          else
            git commit -m "chore: update AP data from Coefficient [automatic]"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

  deploy-pages:
    name: Deploy GitHub Pages
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest dashboard
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
