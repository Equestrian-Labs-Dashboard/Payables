name: Update AP Dashboard Data

on:
  schedule:
    # Weekly refresh: Monday 09:00 UTC (05:00 La Paz)
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    name: Update data from QuickBooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r scripts/requirements.txt

      - name: Validate QuickBooks configuration
        env:
          QBO_CLIENT_ID: ${{ secrets.QBO_CLIENT_ID }}
          QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
          QBO_REALM_ID: ${{ secrets.QBO_REALM_ID }}
          QBO_REFRESH_TOKEN: ${{ secrets.QBO_REFRESH_TOKEN }}
        shell: bash
        run: |
          missing=0
          for name in QBO_CLIENT_ID QBO_CLIENT_SECRET QBO_REALM_ID QBO_REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub secret::$name is not configured in Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Pull Accounts Payable from QuickBooks Online
        env:
          QBO_CLIENT_ID: ${{ secrets.QBO_CLIENT_ID }}
          QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
          QBO_REALM_ID: ${{ secrets.QBO_REALM_ID }}
          QBO_REFRESH_TOKEN: ${{ secrets.QBO_REFRESH_TOKEN }}
          QBO_ENVIRONMENT: ${{ vars.QBO_ENVIRONMENT || 'sandbox' }}
        run: python scripts/transform.py

      - name: Commit updated dashboard data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ap-data.json
          if git diff --staged --quiet; then
            echo "No AP data changes to commit."
          else
            git commit -m "chore: update AP data from QuickBooks [automatic]"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

  deploy-pages:
    name: Deploy GitHub Pages
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest dashboard
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
