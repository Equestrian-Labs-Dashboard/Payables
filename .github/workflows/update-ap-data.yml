name: Update AP Dashboard Data

on:
  schedule:
    # Todos los dias a las 09:00 UTC (05:00 La Paz)
    - cron: "0 9 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Pull data from Bill.com and rebuild ap-data.json
        env:
          BILL_API_KEY: ${{ secrets.BILL_API_KEY }}
          BILL_USERNAME: ${{ secrets.BILL_USERNAME }}
          BILL_PASSWORD: ${{ secrets.BILL_PASSWORD }}
          BILL_ORG_ID: ${{ secrets.BILL_ORG_ID }}
        run: python scripts/transform.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ap-data.json
          git diff --staged --quiet || git commit -m "chore: actualizar ap-data.json [automatico]"
          git push

  deploy-pages:
    needs: update-data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
